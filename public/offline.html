<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020617">
  <title>Sin conexión | Gym Master</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border: 1px solid #334155;
      border-radius: 24px;
      background: #0f172a;
      text-align: center;
    }
    h1 { margin: 0 0 16px; font-size: 1.6rem; }
    p { color: #cbd5e1; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      border-radius: 999px;
      background: #f8fafc;
      color: #020617;
      font-weight: 700;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #38bdf8; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Gym Master</h1>
    <p>Sin conexión. Verificá tu conexión a Internet e intentá nuevamente.</p>
    <p lang="en">You are offline. Check your Internet connection and try again.</p>
    <a href="/dashboard">Reintentar / Retry</a>
  </main>
</body>
</html>
